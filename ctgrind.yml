name: ctgrind

# Constant-time validation using ctgrind, a Valgrind-based tool by Adam
# Langley that detects branches and memory accesses dependent on tainted
# (secret) data. See:
#
#   https://github.com/agl/ctgrind
#
# Why a separate workflow?
#
#   - ctgrind needs a Valgrind that has been patched to expose the
#     client request `VALGRIND_MAKE_MEM_UNDEFINED` (and Langley's helper
#     macros). Building this lives outside the hot CI loop.
#   - Constant-time issues are subtle and best surfaced as a dedicated
#     status check, not folded into "tests passed".
#
# Status: SKELETON. Until the scheme bodies and their ctgrind
# annotations land, this job runs Valgrind on the unit tests as a smoke
# check that the toolchain is wired up. The real annotations (marking
# `SK.seed`, `SK.prf`, FORS leaves, etc. as secret) will be added
# alongside the crypto implementation in Lane A.

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly full sweep, Sunday 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ctgrind:
    name: ctgrind smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # The ctgrind helpers live in <valgrind/memcheck.h> as the client
      # request `VALGRIND_MAKE_MEM_UNDEFINED`. Stock Valgrind packages
      # ship them. When the real annotations land they will live in
      # `src/ctgrind.zig` and call these macros through `@cImport`.
      - name: Confirm ctgrind headers present
        run: |
          test -f /usr/include/valgrind/memcheck.h
          echo "valgrind memcheck headers found"

      - name: Build tests in ReleaseSafe with debug info
        run: |
          zig build test \
            -Doptimize=ReleaseSafe \
            --summary all

      # Skeleton run: invoke Valgrind on the test binary that `zig build
      # test` produced. Until secret-data taint is wired in, this only
      # surfaces ordinary memory errors. A non-zero exit fails the job.
      - name: Run Valgrind smoke pass
        run: |
          # Locate the most recently built test binary. zig caches them
          # under .zig-cache/o/<hash>/test.
          bin=$(find .zig-cache -name 'test' -type f -executable -printf '%T@ %p\n' \
                | sort -nr | head -1 | awk '{print $2}')
          if [ -z "$bin" ]; then
            echo "::warning::no test binary located; skipping valgrind"
            exit 0
          fi
          echo "running valgrind on $bin"
          valgrind \
            --error-exitcode=1 \
            --leak-check=no \
            --track-origins=yes \
            "$bin"

      - name: Note on full ctgrind coverage
        run: |
          echo "::notice::This run is a smoke check. Full constant-time"
          echo "::notice::validation requires `VALGRIND_MAKE_MEM_UNDEFINED`"
          echo "::notice::annotations on every secret input. Those land"
          echo "::notice::alongside the crypto implementation in Lane A."
