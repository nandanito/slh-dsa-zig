name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Formatting check — fast, runs first so a misformatted PR fails before we
  # pay for the full matrix.
  # ---------------------------------------------------------------------------
  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: zig fmt --check
        run: zig fmt --check .

  # ---------------------------------------------------------------------------
  # Build + unit tests on x86_64 and ARM64, Debug + ReleaseSafe.
  # ---------------------------------------------------------------------------
  build-test:
    name: build & test (${{ matrix.os }}, ${{ matrix.optimize }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # x86_64
          - ubuntu-24.04-arm     # aarch64
        optimize:
          - Debug
          - ReleaseSafe
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Print Zig version
        run: zig version

      - name: Build library
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Run unit tests
        run: zig build test -Doptimize=${{ matrix.optimize }}

      - name: Build examples
        run: zig build examples -Doptimize=${{ matrix.optimize }}

      - name: Build bench binary (smoke — do not run)
        run: zig build bench -Dbench-optimize=ReleaseFast --summary all
        # We build the bench binary but don't run it; the inner loops will
        # @panic until the scheme implementation lands. Confirming it
        # compiles in ReleaseFast catches optimisation-mode-specific issues.

  # ---------------------------------------------------------------------------
  # Lane B compliance — every commit that touches `upstream-candidate/`
  # must carry the `Lane B compliant:` trailer.
  # ---------------------------------------------------------------------------
  lane-b-trailer:
    name: lane B trailer check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Lane B commits carry the required trailer
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Walk every commit in the PR.
          fail=0
          for sha in $(git rev-list "$base..$head"); do
            # Did this commit touch upstream-candidate/?
            if git diff-tree --no-commit-id --name-only -r "$sha" \
                | grep -q '^upstream-candidate/'; then
              # Then the message must contain the trailer.
              if ! git log -1 --format=%B "$sha" \
                  | grep -qE '^Lane B compliant: human-authored, no AI assistance\.?$'; then
                echo "::error::commit $sha touches upstream-candidate/ but is missing the required trailer."
                echo "  expected line in commit message:"
                echo "    Lane B compliant: human-authored, no AI assistance."
                fail=1
              fi
            fi
          done
          exit "$fail"
