# Documentation site — build check on PRs, publish to GitHub Pages on main.
#
# The docs toolchain (mkdocs-material) is Python and DOCS-ONLY: it is never
# imported by the library and is not required to build, test, benchmark or fuzz
# it. See docs/requirements.txt.
#
# `mkdocs build --strict` turns warnings into errors, so a broken internal link
# or a nav entry pointing at a missing page fails the job rather than silently
# shipping a 404.

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  # Allow publishing on demand without pushing a docs change.
  workflow_dispatch:

# Least privilege by default; the deploy job widens it below.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Build
        run: mkdocs build --strict

      # `--strict` cannot catch an unrendered icon shortcode: `:material-foo:`
      # left as literal text is perfectly valid markdown, so mkdocs has no
      # reason to warn. It shipped to production exactly once for that reason.
      # Assert the built HTML contains no leftover shortcodes.
      - name: Assert icon shortcodes rendered
        run: |
          leaked=$(grep -roE ':material-[a-z0-9-]+:|:fontawesome-[a-z0-9-]+:' site --include='*.html' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Unrendered icon shortcodes in the built site."
            echo "pymdownx.emoji is probably missing or misconfigured in mkdocs.yml."
            echo "$leaked" | sort -u
            exit 1
          fi
          echo "No unrendered icon shortcodes."

      - name: Upload Pages artifact
        # Only needed for the deploy job, which runs on main only.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to Pages
    # PRs get the strict build check only — no publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write      # to deploy
      id-token: write   # for the Pages OIDC token

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
