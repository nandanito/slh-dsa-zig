name: ctgrind

# Constant-time validation with Valgrind's memcheck, in the style of Adam
# Langley's ctgrind (https://github.com/agl/ctgrind): mark secret data as
# "undefined", then any branch or memory access that depends on it is reported
# as a use-of-uninitialised-value error.
#
# The taint markers are Valgrind client requests issued via `std.valgrind`
# (pure Zig inline asm — no C shim, no <valgrind/memcheck.h>). Two harnesses:
# `tests/ctgrind/taint_components.zig` taints SK.seed and runs the
# secret-processing primitives (WOTS+ pkGen, FORS node), and
# `tests/ctgrind/taint_sign.zig` taints SK.seed + SK.prf and runs a whole
# keygen + sign. `negative_control.zig` proves the taint is live. See issue #34
# for the taint model and src/ct.zig for the declassification hooks the
# whole-sign audit needs.
#
# Why a separate workflow: constant-time issues are subtle and best surfaced
# as a dedicated check, and Valgrind's slowdown keeps it out of the hot loop.

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly full sweep, Sunday 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ctgrind:
    name: ctgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # Pin the target CPU to the x86-64-v3 microarchitecture level (AVX2,
      # FMA, BMI — but NOT AVX-512). The GitHub x86_64 runners expose AVX-512,
      # so a `native` build of the SHA-2/SHA-3 code emits EVEX-encoded 512-bit
      # instructions that the apt Valgrind (3.22) cannot decode — it SIGILLs
      # before validating anything. v3 keeps realistic vectorisation within
      # Valgrind's instruction support. Lift back to native once Valgrind
      # handles AVX-512 — see #6.
      #
      # ReleaseSafe: optimised (so the audited code is the code that ships)
      # but with safety checks, and with the constant-time markers active.
      - name: Build ctgrind harness
        run: |
          zig build ctgrind \
            -Doptimize=ReleaseSafe \
            -Dcpu=x86_64_v3 \
            --summary all

      # Three Valgrind passes. `--error-exitcode=1` turns any report (a
      # conditional jump or memory access depending on tainted data) into a
      # non-zero exit. No harness heap-allocates, so leak checking is off.
      #
      #   1. Negative control — MUST be flagged. It taints a byte and branches
      #      on it; a clean run means the std.valgrind client requests are inert
      #      (the vacuous-gate failure mode), so we fail the job.
      #   2. Components — the secret-processing primitives MUST be clean.
      #   3. Whole path — keygen + sign MUST be clean.
      #
      # 2 and 3 are both kept: the component pass needs no declassification to
      # be meaningful, so it localises a regression to a single primitive, while
      # the whole-path pass covers their composition.
      - name: Run Valgrind constant-time check
        run: |
          set -euo pipefail
          find_bin() {
            find .zig-cache -name "$1" -type f -perm -u+x \
              -printf '%T@ %p\n' | sort -nr | head -1 | awk '{print $2}'
          }
          components=$(find_bin 'slh-dsa-ctgrind')
          whole=$(find_bin 'slh-dsa-ctgrind-sign')
          negctl=$(find_bin 'slh-dsa-ctgrind-negctl')
          for pair in "components:$components" "whole:$whole" "negctl:$negctl"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::ctgrind binary not found: ${pair%%:*}"
              exit 1
            fi
          done

          echo "== negative control ($negctl): expecting Valgrind to report a leak =="
          if valgrind --error-exitcode=1 --leak-check=no --track-origins=yes "$negctl"; then
            echo "::error::negative control was NOT flagged — taint tracking is inert, so the gate is vacuous"
            exit 1
          fi
          echo "negative control correctly flagged; taint tracking is live"

          echo "== components ($components): expecting a clean run =="
          valgrind \
            --error-exitcode=1 \
            --leak-check=no \
            --track-origins=yes \
            "$components"

          echo "== whole keygen + sign ($whole): expecting a clean run =="
          valgrind \
            --error-exitcode=1 \
            --leak-check=no \
            --track-origins=yes \
            "$whole"

      - name: Coverage note
        if: always()
        run: |
          echo "::notice::PROBE-ONLY BRANCH — see the avx512-probe job."
          echo "::notice::Verifies that no branch and no memory address in key"
          echo "::notice::generation (FIPS 205 §9.1) or signing (§9.2) depends on"
          echo "::notice::the value of SK.seed or SK.prf, plus the secret-processing"
          echo "::notice::primitives in isolation (WOTS+ pkGen, FORS node)."
          echo "::notice::Parameter sets: SHAKE/SHA2 128f and 192f — every distinct"
          echo "::notice::adapter path, including the §11.2 SHA-512 widening at"
          echo "::notice::n>16 (SK.prf keys HMAC-SHA-512 there). The other eight"
          echo "::notice::sets differ only in public tree geometry."
          echo "::notice::Public SK.seed-derived intermediates (R, PK_FORS, each"
          echo "::notice::XMSS root) are declassified in-library via src/ct.zig."
          echo "::notice::Not covered: verify (no secret inputs by construction),"
          echo "::notice::and the AVX-512 code paths Valgrind cannot decode (#6)."

  # TEMPORARY PROBE (issue #6) — never blocking. Measures, rather than recalls,
  # which CPU features the packaged Valgrind actually chokes on.
  avx512-probe:
    name: avx512 probe (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Environment
        run: |
          . /etc/os-release && echo "runner: $PRETTY_NAME"
          sudo apt-get update -qq
          echo "--- apt candidates for valgrind ---"
          apt-cache policy valgrind
          sudo apt-get install -y valgrind >/dev/null
          valgrind --version
          echo "--- runner CPU: sha / avx512 flags ---"
          lscpu | tr ' ' '\n' | grep -oE '^(sha_ni|sha|avx512[a-z0-9_]*)$' | sort -u | tr '\n' ' '; echo

      # Three targets, each built, disassembled and run under Valgrind. Nothing
      # here aborts the job: the point is the comparison table at the end.
      #
      #   native        — what the audit would ideally cover
      #   native-sha    — native minus SHA-NI only (a precise pin)
      #   x86_64_v3     — the current conservative pin (control)
      - name: Compare CPU targets under Valgrind
        run: |
          set -uo pipefail
          find_bin() {
            find .zig-cache -name "$1" -type f -perm -u+x \
              -printf '%T@ %p\n' | sort -nr | head -1 | awk '{print $2}'
          }
          printf '%-14s %8s %8s %10s\n' TARGET ZMM SHA-NI VALGRIND > /tmp/table
          for cpu in native native-sha x86_64_v3; do
            echo "::group::=== $cpu ==="
            if ! zig build ctgrind -Doptimize=ReleaseSafe -Dcpu="$cpu" --summary all; then
              printf '%-14s %8s %8s %10s\n' "$cpu" '?' '?' 'BUILD-FAIL' >> /tmp/table
              echo "::endgroup::"; continue
            fi
            comp=$(find_bin 'slh-dsa-ctgrind')
            zmm=$(objdump -d "$comp" | grep -cE '%zmm' || true)
            shani=$(objdump -d "$comp" | grep -cE 'sha256(msg1|msg2|rnds2)|sha1(msg1|msg2|nexte|rnds4)' || true)
            echo "binary=$comp zmm=$zmm sha-ni=$shani"
            # Self-check: picking a stale binary from another target would make
            # the whole table meaningless, and `-sha` must mean zero SHA-NI.
            case "$cpu" in
              *-sha) [ "$shani" -eq 0 ] || { echo "::error::$cpu binary still has SHA-NI — wrong binary picked"; exit 1; } ;;
              x86_64_v3) [ "$shani" -eq 0 ] && [ "$zmm" -eq 0 ] || { echo "::error::v3 binary has sha/avx512 — wrong binary picked"; exit 1; } ;;
            esac
            if valgrind --error-exitcode=1 --leak-check=no --track-origins=yes "$comp" 2>&1 | tail -40; then
              verdict=CLEAN
            else
              verdict=FAIL
            fi
            printf '%-14s %8s %8s %10s\n' "$cpu" "$zmm" "$shani" "$verdict" >> /tmp/table
            echo "::endgroup::"
          done
          echo "=============== PROBE RESULT ==============="
          cat /tmp/table
          { echo '### ctgrind CPU-target probe (#6)'; echo; echo '```'; cat /tmp/table; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
