name: fuzz

# Coverage-guided fuzzing of the attacker-facing surfaces (SLH-DSA `verify`
# and the ACVP vector parser) via Zig's built-in fuzzer. See issue #9 and
# tests/fuzz/README.md.
#
# GitHub Actions caps a single job at 6h, so "≥24h in CI" is not a single
# run. Instead this gate is *cumulative*: a nightly window fuzzes for a few
# hours, the corpus + coverage are persisted across runs (actions/cache), and
# a running total of fuzz-hours is tracked in the job summary. A component
# graduates once its cumulative time clears the bar.
#
# The accounting is PER TARGET, one matrix job each, because the bar is worded
# per component and a shared number cannot stand in for it (issue #65):
#
#   - Nothing is shared between targets. Corpus, `seen_pcs` and `bests` are all
#     per-test in `Fuzzer.init`, and the corpus directory is keyed by the test
#     name. Time spent on one target buys another target nothing, so a global
#     total is not a proxy for any target's progress.
#   - Within one binary the fuzzer time-slices adaptively between its tests, so
#     a wall-clock window is divided among them, not replicated. A global
#     counter therefore over-reports every target at once, and adding a harness
#     silently dilutes the ones already there.
#
# Each job builds a single-harness binary (`zig build fuzz-<slug>`, filtered in
# build.zig), so the job's wall-clock IS that target's fuzz time. This costs
# more runner-hours than one shared job and buys each target the whole window
# instead of roughly a sixth of it.
#
# Mechanics worth knowing (all verified against Zig 0.16.0):
#
#   - The stock 0.16.0 test runner does NOT compile in fuzz mode; the repo
#     ships a vendored, patched runner (tests/fuzz/test_runner.zig) wired in
#     via build.zig. `zig build fuzz --fuzz=N` is the headless entry point.
#   - `zig build fuzz --fuzz=N` exits 0 EVEN WHEN it finds a crash. It writes
#     the crashing input to `.zig-cache/f/crash` and logs it, but the process
#     return code is success. So a crash MUST be detected out-of-band — this
#     workflow deletes any stale marker up front and fails if one reappears.
#   - Corpus lives in `.zig-cache/f/`, coverage maps in `.zig-cache/v/`; both
#     are written incrementally, so a `timeout`-terminated run still leaves a
#     consistent, durable corpus.
#   - `-ffuzz` instrumentation comes from the LLVM backend only, and
#     `fuzzer.zig` reads the counters through WEAK externs — so an
#     uninstrumented build does not fail to link, it silently fuzzes blind with
#     `pcs_len = 0` and an empty corpus. build.zig pins `use_llvm` on the fuzz
#     artifact; the `Verify coverage instrumentation` step below asserts the
#     pin held. This job ran uninstrumented for its whole life before that
#     assert existed — see issue #68.

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly 03:00 UTC — clear of the weekly Saturday 02:00 ctgrind run.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Fuzz duration in seconds (manual runs only)'
        required: false
        default: '1800'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The per-target bar, in hours. `tests/fuzz/README.md` and CLAUDE.md quote it.
  GATE_HOURS: 24

jobs:
  # Single source of truth for the target list. The matrix fans out from it and
  # the gate job checks its rows against it, so a target cannot be fuzzed
  # without being gated, or silently vanish from the gate by failing early.
  # (A literal `matrix:` block cannot be read back by a later job, and the `env`
  # context is not available in `strategy` — hence a job output.)
  targets:
    name: fuzz targets
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          cat > targets.json <<'JSON'
          [
            {"slug": "verify-shake-128f",          "label": "verify (SLH-DSA-SHAKE-128f)"},
            {"slug": "verify-sha2-128f",           "label": "verify (SLH-DSA-SHA2-128f)"},
            {"slug": "verify-prehash-shake-128f",  "label": "verifyPreHash (SLH-DSA-SHAKE-128f)"},
            {"slug": "verify-prehash-sha2-128f",   "label": "verifyPreHash (SLH-DSA-SHA2-128f)"},
            {"slug": "acvp-parser",                "label": "ACVP vector parser"},
            {"slug": "hex-decode",                 "label": "hexDecode"}
          ]
          JSON
          echo "list=$(jq -c . targets.json)" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.slug)\t\(.label)"' targets.json

  fuzz:
    name: fuzz (${{ matrix.target.slug }})
    needs: targets
    runs-on: ubuntu-latest
    # 4h ceiling: comfortably above the 3h scheduled window, under the 6h cap.
    timeout-minutes: 240
    strategy:
      # One target crashing must not cancel the others: their corpora and
      # counters are independent, and losing a window costs real wall-clock.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          # setup-zig caches the whole of `.zig-cache`, which is also where the
          # fuzz corpus (`f/`) and coverage maps (`v/`) live — and every job in
          # this matrix shares one key prefix, `setup-zig-cache-v2-fuzz-…`.
          # Left on, it smuggles other targets' corpora into this job outside
          # the per-target cache, makes the corpus count report inputs this
          # target never produced, and has six jobs race to write one entry.
          # Observed directly: a single-harness `acvp-parser` job's artifact
          # contained all six target directories.
          #
          # Whatever corpus this job sees must come only from its own
          # `actions/cache` entry, so opt out. Costs a Zig rebuild per run,
          # which is noise against a 3h fuzz window.
          use-cache: false

      - name: Determine run parameters
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              secs=300      # 5-min regression smoke; does not persist corpus.
              persist=false
              ;;
            schedule)
              secs=10800    # 3h nightly window.
              persist=true
              ;;
            workflow_dispatch)
              secs="${{ github.event.inputs.duration_seconds }}"
              persist=true
              ;;
          esac
          echo "secs=$secs"       >> "$GITHUB_OUTPUT"
          echo "persist=$persist" >> "$GITHUB_OUTPUT"

      # Restore the accumulated corpus, coverage maps, and fuzz-hours counter.
      # The key is unique per run so a fresh entry is always saved on scheduled
      # runs, while `restore-keys` pulls the most recent prior corpus — this is
      # the standard accumulating-cache pattern. PRs restore (read) but never
      # save, so they start from the latest main-branch corpus.
      - name: Restore fuzz corpus
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .zig-cache/f
            .zig-cache/v
            fuzz-stats
          # One cache per target: it carries that target's corpus directory and
          # its own counter, so no target can inherit another's credit.
          #
          # `v3` (per-target) supersedes the flat `v2` from #68, which in turn
          # deliberately orphaned everything before it. Orphaning an accrued
          # corpus is normally reckless — it is worth weeks of wall-clock and
          # `restore-keys` exists to protect it — and it is acceptable here only
          # because the pre-#68 corpus was measured empty rather than assumed
          # so: the build was never instrumented, so no input was ever recorded.
          # Nothing accrued under `v2` either; it has not survived a nightly.
          key: fuzz-corpus-v3-${{ matrix.target.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v3-${{ matrix.target.slug }}-

      # A crash marker is a single fixed file (`.zig-cache/f/crash`). Delete any
      # copy restored from the cache so that its presence AFTER this run
      # unambiguously means a crash was found in THIS run — a bug already fixed
      # in the tree must not keep the gate red forever.
      - name: Clear stale crash marker
        shell: bash
        run: rm -f .zig-cache/f/crash

      # Compile this target's harness and smoke-run it once (empty input). This
      # runs WITHOUT `|| true`, so a broken harness or a bug reachable from the
      # empty input fails the job here — the timed run below swallows
      # `timeout`'s exit code and could otherwise mask a compile failure.
      #
      # `fuzz-<slug>` is filtered to exactly one harness, which is what makes
      # this job's wall-clock equal to that target's fuzz time.
      #
      # A filter that matches NOTHING is silent: verified against Zig 0.16.0,
      # `zig build fuzz-<slug>` with a non-matching filter prints
      # "Build Summary: 3/3 steps succeeded" / "run test success" and exits 0.
      # The target would then bank a full window having executed no harness at
      # all — the same shape of lie as #68. So assert the count positively.
      # Any of these three forms proves one test ran, and none of them appears
      # in the zero-match output:
      #   "1/1 tests passed"   — build summary
      #   "1 pass (1 total)"   — per-step line under --summary all
      #   "All 1 tests passed" — runner terminal output
      - name: Build & smoke-run fuzz target
        shell: bash
        run: |
          set -euo pipefail
          out=$(zig build fuzz-${{ matrix.target.slug }} --summary all 2>&1)
          echo "$out"
          if ! grep -qE '1/1 tests passed|1 pass \(1 total\)|All 1 tests passed' <<<"$out"; then
            echo "::error::expected exactly one harness for"
            echo "::error::'${{ matrix.target.slug }}' and could not confirm one ran. The"
            echo "::error::build.zig filter probably no longer matches exactly one test,"
            echo "::error::which silently exits 0 — per-target accounting would be wrong."
            exit 1
          fi

      - name: Fuzz
        id: fuzz
        shell: bash
        run: |
          set -euo pipefail
          secs='${{ steps.cfg.outputs.secs }}'
          echo "Fuzzing ${{ matrix.target.slug }} for ${secs}s"
          # `--fuzz` takes an iteration ceiling, not a time limit, so set it far
          # above what the window can reach and let `timeout` bound the wall
          # clock.
          start=$SECONDS
          rc=0
          timeout "${secs}" zig build fuzz-${{ matrix.target.slug }} --fuzz=1000000000 --summary all || rc=$?
          elapsed=$(( SECONDS - start ))
          echo "elapsed=${elapsed}" >> "$GITHUB_OUTPUT"
          # Exit-code triage. This build is compiled with `-ffuzz`, unlike the
          # non-`--fuzz` smoke above, so a fuzz-mode-only compile break surfaces
          # ONLY here — do not blanket-swallow it.
          #   124 : `timeout` terminated the run at the time limit (expected).
          #     0 : the iteration ceiling was reached, or — note — a crash was
          #         found (`--fuzz` exits 0 even on a crash; caught via the
          #         marker below).
          #  else : a real failure (fuzz-mode compile error, runner abort). Fail.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::fuzz run failed with exit ${rc} (not a timeout)"
            exit "$rc"
          fi
          if [ -f .zig-cache/f/crash ]; then
            echo "crashed=true" >> "$GITHUB_OUTPUT"
          else
            echo "crashed=false" >> "$GITHUB_OUTPUT"
          fi

      # An uninstrumented fuzz build is silent by construction: the weak
      # `__start___sancov_cntrs` extern resolves to zero, the fuzzer reports no
      # error, and the job stays green while finding nothing. Read the truth out
      # of the coverage map instead. Layout is `std.Build.abi.SeenPcsHeader`:
      # three native-endian usizes — n_runs, unique_runs, pcs_len.
      - name: Verify coverage instrumentation
        id: cov
        shell: bash
        run: |
          set -euo pipefail
          # The active map is the one this run just wrote; a map from an earlier,
          # differently-instrumented binary has a different name and a stale
          # mtime, so take the newest rather than the first.
          cov=$(ls -t .zig-cache/v/* 2>/dev/null | head -1 || true)
          if [ -z "$cov" ]; then
            echo "::error::no coverage map under .zig-cache/v — the fuzzer never ran"
            exit 1
          fi
          read -r n_runs unique_runs pcs_len < <(od -An -tu8 -N24 "$cov" | tr -s ' ' | tr -d '\n' | awk '{print $1, $2, $3}')
          echo "coverage map $cov: n_runs=$n_runs unique_runs=$unique_runs pcs_len=$pcs_len"
          {
            echo "n_runs=$n_runs"
            echo "unique_runs=$unique_runs"
            echo "pcs_len=$pcs_len"
          } >> "$GITHUB_OUTPUT"
          if [ "$pcs_len" -eq 0 ]; then
            echo "::error::pcs_len=0 — the fuzz binary carries no SanitizerCoverage"
            echo "::error::instrumentation, so this run was blind and its time must not"
            echo "::error::count toward the gate. Check that build.zig still sets"
            echo "::error::use_llvm=true on the fuzz artifact. See issue #68."
            exit 1
          fi

      - name: Update cumulative fuzz-hours
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fuzz-stats
          counter=fuzz-stats/cumulative-seconds.txt
          prev=$(cat "$counter" 2>/dev/null || echo 0)
          elapsed='${{ steps.fuzz.outputs.elapsed }}'
          crashed='${{ steps.fuzz.outputs.crashed }}'
          # The counter measures CRASH-FREE fuzz time toward the 24h gate, so it
          # accrues only when a persisting run (scheduled/manual, not PR smoke)
          # finished without a crash. A crash-finding run's time does not count
          # — otherwise the gate could be cleared without 24h of clean fuzzing.
          if [ "${{ steps.cfg.outputs.persist }}" = 'true' ] && [ "$crashed" != 'true' ]; then
            total=$(( prev + elapsed ))
          else
            total=$prev
          fi
          echo "$total" > "$counter"
          hours=$(awk "BEGIN { printf \"%.1f\", $total / 3600 }")
          note=""
          if [ "$crashed" = 'true' ]; then note=" (crash found — not counted)"; fi
          # Corpus size is the honest companion to the clock: an instrumented
          # run that finds nothing new still burns time, and #68 showed a clock
          # can read 24h with an empty corpus.
          corpus=$(find .zig-cache/f -type f ! -name '*lock' ! -name 'in*' 2>/dev/null | wc -l | tr -d ' ')
          graduated=no
          if [ "$total" -ge $(( GATE_HOURS * 3600 )) ]; then graduated=yes; fi
          {
            echo "### Fuzzing summary — ${{ matrix.target.label }}"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| target | \`${{ matrix.target.slug }}\` |"
            echo "| this run | ${elapsed}s${note} |"
            echo "| cumulative (crash-free) | ${total}s (~${hours}h) |"
            echo "| gate (${GATE_HOURS}h) cleared | ${graduated} |"
            echo "| instrumented PCs | ${{ steps.cov.outputs.pcs_len }} |"
            echo "| total runs | ${{ steps.cov.outputs.n_runs }} |"
            echo "| coverage-expanding runs | ${{ steps.cov.outputs.unique_runs }} |"
            echo "| corpus entries | ${corpus} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${{ matrix.target.slug }}: ${total}s (~${hours}h), gate cleared: ${graduated}${note}"
          # One row per target for the aggregate `gate` job below.
          mkdir -p fuzz-report
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            '${{ matrix.target.slug }}' "${{ matrix.target.label }}" \
            "$total" "$hours" "$graduated" \
            '${{ steps.cov.outputs.unique_runs }}' "$corpus" \
            > "fuzz-report/${{ matrix.target.slug }}.tsv"

      # Persist the grown corpus + counter (scheduled / manual runs only).
      # Runs before the crash gate so a crash-finding run still saves its
      # coverage progress.
      - name: Save fuzz corpus
        if: always() && steps.cfg.outputs.persist == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .zig-cache/f
            .zig-cache/v
            fuzz-stats
          key: fuzz-corpus-v3-${{ matrix.target.slug }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Artifact names must be unique across the matrix, hence the slug.
      - name: Upload corpus & crashers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target.slug }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .zig-cache/f/**
            .zig-cache/v/**

      - name: Upload gate row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report-${{ matrix.target.slug }}
          if-no-files-found: ignore
          retention-days: 14
          path: fuzz-report/

      - name: Fail if a crash was found
        if: steps.fuzz.outputs.crashed == 'true'
        shell: bash
        run: |
          echo "::error::Fuzzing found a crash in ${{ matrix.target.slug }}. The"
          echo "::error::reproducing input is saved as .zig-cache/f/crash and uploaded"
          echo "::error::in the fuzz-corpus-${{ matrix.target.slug }} artifact."
          exit 1

  # Phase gate 3 reads per target, so report it per target in one place rather
  # than making a human open six job summaries and take a minimum by hand.
  # Reports only — a target below the bar is progress, not a failure, and
  # failing the nightly for it would train everyone to ignore a red fuzz job.
  # Genuine failures (crash, lost instrumentation) fail their own matrix job.
  gate:
    name: fuzz gate
    needs: [targets, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect per-target rows
        uses: actions/download-artifact@v4
        with:
          pattern: fuzz-report-*
          merge-multiple: true
          path: fuzz-report

      # Absent evidence is not evidence of graduation. A target whose job died
      # before writing its row must read as "not satisfied", never be quietly
      # dropped from the denominator — reporting "all 5 cleared" for a six-target
      # matrix is precisely the class of claim this gate exists to prevent. So
      # iterate the expected list and look each row up, rather than counting
      # whatever happened to download.
      - name: Report
        shell: bash
        env:
          TARGETS: ${{ needs.targets.outputs.list }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          set -euo pipefail
          {
            echo "### Phase gate 3 — cumulative fuzzing, per target"
            echo ""
            echo "Bar is ${GATE_HOURS}h of crash-free, coverage-guided fuzzing per"
            echo "target. A component graduates when every target covering it clears it."
            echo ""
            echo "| target | cumulative | ${GATE_HOURS}h | coverage-expanding runs | corpus |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          expected=0
          cleared=0
          missing=0
          while IFS=$'\t' read -r slug label; do
            expected=$(( expected + 1 ))
            row="fuzz-report/${slug}.tsv"
            if [ ! -s "$row" ]; then
              missing=$(( missing + 1 ))
              echo "| ${label} | — | ⚠️ no result | — | — |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::${slug}: no row — its job did not finish reporting"
              continue
            fi
            IFS=$'\t' read -r _ _ _ hours graduated uniq corpus < "$row"
            mark='—'
            if [ "$graduated" = 'yes' ]; then mark='✅'; cleared=$(( cleared + 1 )); fi
            echo "| ${label} | ${hours}h | ${mark} | ${uniq} | ${corpus} |" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | "\(.slug)\t\(.label)"' <<<"$TARGETS")

          # "Satisfied" requires every expected target present, cleared, and its
          # job green. `needs.fuzz.result` is success only when the whole matrix
          # succeeded, so it also covers a crash or lost instrumentation.
          satisfied=no
          if [ "$missing" -eq 0 ] && [ "$cleared" -eq "$expected" ] && [ "$FUZZ_RESULT" = 'success' ]; then
            satisfied=yes
          fi
          {
            echo ""
            if [ "$satisfied" = 'yes' ]; then
              echo "**Gate 3 satisfied: all ${expected} targets cleared ${GATE_HOURS}h.**"
            else
              echo "**Gate 3 not satisfied: ${cleared}/${expected} targets have cleared ${GATE_HOURS}h.**"
              if [ "$missing" -ne 0 ]; then
                echo ""
                echo "> ${missing} target(s) reported nothing this run, so their progress is"
                echo "> unknown — not zero, and not graduated."
              fi
              if [ "$FUZZ_RESULT" != 'success' ]; then
                echo ""
                echo "> Matrix result was \`${FUZZ_RESULT}\`. A gate cannot be declared from a"
                echo "> run that did not complete cleanly."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "gate 3: cleared ${cleared}/${expected}, missing ${missing}, matrix ${FUZZ_RESULT}, satisfied ${satisfied}"

          # Being below the bar is progress, not a failure — the nightly stays
          # green while time accrues, so that a red fuzz run keeps meaning
          # something. But a target that crashed, lost its instrumentation or
          # never reported is a real failure, and this job is the one stable
          # context that sees the whole matrix: keeping it green there would let
          # a required-check configuration pass a run that fuzzed nothing.
          if [ "$FUZZ_RESULT" != 'success' ]; then
            echo "::error::fuzz matrix result was '${FUZZ_RESULT}' — see the"
            echo "::error::per-target jobs for the failure."
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::${missing} target(s) produced no row despite a green"
            echo "::error::matrix — the report cannot be trusted."
            exit 1
          fi
